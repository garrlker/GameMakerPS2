name: Create HTML5 Zip
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@master
    
    - name: Create Archive
      uses: thedoctor0/zip-release@0.7.5
      with:
        type: 'zip'
        directory: 'scripts'
        path: '.'
        filename: 'scripts.html5.zip'
        custom: '-r -P ${{ secrets.ZipPassword }}'
    - name: Create Github Release
      uses: ncipollo/release-action@v1
      with:
        tag: $(cat VERSION)-${{ github.sha }}
        artifacts: "scripts.html5.zip"
        token: ${{ secrets.RELEASE_TOKEN }}
        name: Release $(cat VERSION)-${{ github.sha }}
